model:
  provider: azure-opus
  default: claude-opus-5-5
approvals:
  mode: manual
  cron_mode: deny
  single_query_mode: deny
  unattended_mode: deny
agent:
  reasoning_effort: medium
  max_turns: 25
  disabled_toolsets:
    - terminal
    - code_execution
    - file
    - browser
    - computer_use
    - delegation
    - cronjob
    - image_gen
    - homeassistant
    - discord
    - discord_admin
    - spotify
    - kanban
    - connections
    - skills
memory:
  user_profile_enabled: false
plugins:
  enabled:
    - hermes-forge-ops
  disabled:
    - hermes-forge
platforms:
  telegram:
    gateway_restart_notification: false
platform_toolsets:
  telegram:
    - forge_ops
    - memory
    - session_search
    - todo
    - clarify
  cli:
    - forge_ops
    - memory
    - session_search
    - todo
providers:
  azure-opus:
    name: Claude Opus 5.5 (Microsoft Azure, operator credit)
    api: https://matt-6083-resource.services.ai.azure.com/anthropic
    key_env: AZURE_ANTHROPIC_API_KEY
    transport: anthropic_messages
    default_model: claude-opus-5-5
    models:
      claude-opus-5-5:
        context_length: 1000000
    discover_models: false
tools:
  tool_search:
    enabled: "off"
