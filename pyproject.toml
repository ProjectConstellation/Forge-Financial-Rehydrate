[project]
name = "forge"
version = "0.1.0"
description = "FORGE — Find Opportunities · Reinvest · Grow · Evolve. Autonomous capital growth engine."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "websockets>=13",
  "numpy>=2.1",
  "pyarrow>=17",
  "duckdb>=1.1",
  "cryptography>=43",
  "pyjwt>=2.9",
  "psutil>=6",
  "modal>=0.64",
]

[project.optional-dependencies]
fast = ["uvloop>=0.21"]

[project.scripts]
forge = "forge.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "hypothesis>=6.100",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
